  let canvasCleanup=[];
  function startCanvas(){canvasCleanup.forEach(fn=>fn());canvasCleanup=[];document.querySelectorAll('canvas.network-field').forEach(el=>{const ctx=el.getContext('2d');let points=[],raf=0,width,height;const intro=el.classList.contains('network-field-intro');const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;const resize=()=>{width=el.clientWidth;height=el.clientHeight;const dpr=Math.min(devicePixelRatio||1,2);el.width=width*dpr;el.height=height*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);const count=Math.min(60,Math.max(24,Math.round(width*height/20000)));points=Array.from({length:count},(_,i)=>({x:((i*83.13+i*i*31.9)%997)/997*width,y:((i*163.71+i*i*49.21)%991)/991*height,vx:(i%3-1)*.15,vy:(i%5-2)*.07,r:i%9===0?2:1}))};const draw=()=>{ctx.clearRect(0,0,width,height);points.forEach((p,i)=>{if(!reduce){p.x+=p.vx;p.y+=p.vy;if(p.x<0||p.x>width)p.vx*=-1;if(p.y<0||p.y>height)p.vy*=-1}for(let j=i+1;j<points.length;j++){const q=points[j],dist=Math.hypot(p.x-q.x,p.y-q.y),threshold=intro?165:133;if(dist<threshold){ctx.beginPath();ctx.strokeStyle=`rgba(${intro?'155,107,255':'78,116,211'},${(.2*(1-dist/threshold)).toFixed(3)})`;ctx.moveTo(p.x,p.y);ctx.lineTo(q.x,q.y);ctx.stroke()}}ctx.beginPath();ctx.fillStyle=i%5===0?'#cc69ff':'#60bff4';ctx.globalAlpha=.6;ctx.arc(p.x,p.y,p.r,0,Math.PI*2);ctx.fill();ctx.globalAlpha=1});if(!reduce)raf=requestAnimationFrame(draw)};resize();draw();addEventListener('resize',resize);canvasCleanup.push(()=>{cancelAnimationFrame(raf);removeEventListener('resize',resize)})})}
  function render(focusSelector){const y=window.scrollY;document.body.style.overflow=state.project||state.help||!state.entered?'hidden':'';if(!state.data){root.innerHTML=makeEmpty();return}const c=getProfile();document.title=`${c.prenom} ${c.nom} | Portfolio interactif`;if(!state.selectedSkill)state.selectedSkill=c.competences?.[0]?.skill_slug;root.innerHTML=`<div class="site-root">${makeBackground()}${!state.entered?makeIntro():''}<div class="site-content ${!state.entered?'not-entered':''}">${makeHeader()}${state.mode==='demo'?`<div class="demo-note"><span class="online-pulse"></span> Démonstration avec les données d'exemple « ${esc(getName())} ». Lance l'API pour afficher ton CV. <button data-action="retry">Réessayer</button></div>`:''}<main>${makeHero()}${makeTimeline()}${makeSkills()}${makeProjects()}${makeGraph()}${makeContact()}</main></div>${makeProjectModal()}${makeHelp()}</div>`;reveal();startCanvas();requestAnimationFrame(()=>{window.scrollTo(0,y);if(focusSelector)document.querySelector(focusSelector)?.focus({preventScroll:true})})}
  async function loadApi(){try{const data=await fetchJson(`/api/portfolio/${encodeURIComponent(slug)}?limit=100`);state.data=data;state.mode='live';render();loadGraph()}catch(err){state.mode=slug===seed.candidat_slug?'demo':'error';render()}}
  async function loadGraph(){try{const data=await fetchJson(`/api/graph/competences/${encodeURIComponent(slug)}`);if(data.nodes?.length){state.graph=data;state.graphSource='neo4j';render()}}catch{}}
  async function loadSkill(){const selected=state.selectedSkill;state.detail=null;try{const data=await fetchJson(`/api/portfolio/${encodeURIComponent(slug)}/competences/${encodeURIComponent(selected)}`);if(state.selectedSkill===selected){state.detail=data;render(`[data-skill="${key(selected)}"]`)}}catch{}}
  async function openProject(id){const project=getProjects().find(p=>p.projet_slug===id);if(!project)return;state.project=project;state.projectDetail=null;render('[data-action="close"]');try{const detail=await fetchJson(`/api/projets/${encodeURIComponent(id)}`);if(state.project?.projet_slug===id){state.projectDetail=detail;render('[data-action="close"]')}}catch{}}
  function changeSkill(id,fromGraph=false){if(!getProfile().competences?.some(c=>c.skill_slug===id))return;state.selectedSkill=id;state.detail=null;render(fromGraph?null:`[data-skill="${key(id)}"]`);loadSkill();if(fromGraph)setTimeout(()=>scrollToId('competences'),30)}
  function nodeAction(id){if(id.startsWith('projet:'))openProject(id.replace('projet:',''));if(id.startsWith('competence:'))changeSkill(id.replace('competence:',''),true)}
  function selectNode(id,focus=false){state.selectedNode=id;render(focus?'.graph-svg-wrap':null)}
  function zoom(direction){state.zoom=Math.max(.75,Math.min(1.45,state.zoom+direction*.15));render('.graph-svg-wrap')}
  document.addEventListener('click',e=>{
    const target=e.target.closest('[data-action],[data-scroll],[data-timeline],[data-skill],[data-filter],[data-project],[data-node],[data-zoom],[data-node-open]');
    if(!target){if(e.target.matches('[data-overlay="1"]')){state.project=null;state.projectDetail=null;state.help=false;render()}return}
    const val=target.dataset;
    if(val.action){switch(val.action){case'enter':state.entered=true;render();scrollToId('accueil');break;case'help':state.help=true;render('[data-action="close-help"]');break;case'menu':state.mobileNav=!state.mobileNav;render();break;case'close':state.project=null;state.projectDetail=null;render();break;case'close-help':state.help=false;render();break;case'retry':loadApi();break}return}
    if(val.scroll){state.mobileNav=false;state.active=val.scroll;document.querySelector('.topnav')?.classList.remove('is-open');document.querySelectorAll('.topnav button').forEach(b=>b.classList.toggle('active',b.dataset.scroll===state.active));scrollToId(val.scroll);return}
    if(val.timeline){state.timeline=val.timeline;render(`[data-timeline="${val.timeline}"]`);return}
    if(val.skill){changeSkill(val.skill);return}
    if(val.filter){state.filter=val.filter;render(`[data-filter="${val.filter}"]`);return}
    if(val.project){openProject(val.project);return}
    if(val.node){selectNode(val.node);return}
    if(val.nodeOpen){nodeAction(val.nodeOpen);return}
    if(val.zoom)zoom(val.zoom==='+'?1:-1)
  });
  document.addEventListener('keydown',e=>{
    const isInput=['INPUT','TEXTAREA','SELECT'].includes(e.target.tagName)||e.target.isContentEditable;
    if(!state.entered){if(e.key==='Enter'||e.key==='ArrowDown'){e.preventDefault();state.entered=true;render();scrollToId('accueil')}return}
    if(e.key==='Escape'){if(state.project||state.help){state.project=null;state.projectDetail=null;state.help=false;render()}return}
    if(state.help||state.project)return;
    if(isInput||e.metaKey||e.ctrlKey||e.altKey)return;
    const graphFocused=e.target.closest?.('.graph-svg-wrap');
    if(graphFocused){
      const {nodes}=graphInfo(),idx=Math.max(0,nodes.findIndex(n=>n.id===state.selectedNode));
      if(['ArrowRight','ArrowDown','ArrowLeft','ArrowUp'].includes(e.key)){e.preventDefault();selectNode(nodes[(idx+(['ArrowRight','ArrowDown'].includes(e.key)?1:-1)+nodes.length)%nodes.length].id,true);return}
      if(e.key==='Enter'||e.key===' '){e.preventDefault();nodeAction(state.selectedNode);return}
      if(['+','='].includes(e.key)){e.preventDefault();zoom(1);return}
      if(e.key==='-'){e.preventDefault();zoom(-1);return}
    }
    const isButton=e.target.closest?.('button,a');
    if(e.key==='?'&&!isButton){e.preventDefault();state.help=true;render('[data-action="close-help"]');return}
    if(isButton)return;
    if(/^[1-6]$/.test(e.key)){e.preventDefault();const id=sections[Number(e.key)-1][0];state.active=id;scrollToId(id);return}
    if(e.key==='ArrowDown'||e.key==='ArrowUp'){e.preventDefault();const idx=sections.findIndex(([id])=>id===state.active),next=Math.max(0,Math.min(sections.length-1,idx+(e.key==='ArrowDown'?1:-1)));state.active=sections[next][0];scrollToId(state.active)}
  });
  function observeSections(){const observer=new IntersectionObserver(entries=>{entries.forEach(entry=>{if(entry.isIntersecting&&state.entered){state.active=entry.target.id;document.querySelectorAll('.topnav button').forEach(b=>b.classList.toggle('active',b.dataset.scroll===state.active))}})},{rootMargin:'-38% 0px -48% 0px'});const scan=()=>sections.forEach(([id])=>{const el=document.getElementById(id);if(el)observer.observe(el)});scan();const mutation=new MutationObserver(()=>scan());mutation.observe(root,{childList:true,subtree:false})}
  render();observeSections();loadApi();
})();

</script></body></html>
